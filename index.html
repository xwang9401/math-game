<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>速算小达人 · 三年级速算练习</title>
  <meta name="description" content="帮助小学三年级学生练习速算的小游戏：加减法、乘法、除数是一位数的除法，练习与挑战双模式。">
  <link rel="stylesheet" href="style.css">
  <!-- PWA：添加到主屏幕 / 离线可玩 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff9f43">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="速算小达人">
</head>
<body>

  <header class="topbar">
    <div class="logo">🚀 速算小达人</div>
    <div class="controls">
      <div class="seg" id="difficultySeg">
        <button class="seg-btn active" data-diff="basic">基础</button>
        <button class="seg-btn" data-diff="advanced">进阶</button>
      </div>
      <button id="soundBtn" class="icon-btn" type="button" title="音效开关" aria-label="关闭音效" aria-pressed="true">🔊</button>
    </div>
  </header>

  <main>

    <!-- ========== 首页 ========== -->
    <section id="screen-home" class="screen active">
      <h2>选择一种玩法，开始练习吧！</h2>
      <div class="mode-cards">
        <button class="mode-card adventure" data-mode="adventure">
          <span class="mode-emoji" id="advCardEmoji">👸</span>
          <span class="adv-card-text">
            <span class="mode-name">闯关冒险 · 雪儿公主的魔法之旅</span>
            <span class="mode-desc">答对帮公主甩开怪兽，收集魔法水晶！</span>
            <span class="adv-progress" id="homeAdv"></span>
          </span>
        </button>
        <button class="mode-card scrolls" data-mode="scrolls">
          <span class="mode-emoji">📖</span>
          <span class="adv-card-text">
            <span class="mode-name">速算秘籍 · 巧算上卷</span>
            <span class="mode-desc">学会 8 个速算口诀，做题又快又准！</span>
            <span class="adv-progress" id="homeScrolls"></span>
          </span>
        </button>
        <button class="mode-card" data-mode="practice">
          <span class="mode-emoji">📝</span>
          <span class="mode-name">练习模式</span>
          <span class="mode-desc">不限时间，自选题型，慢慢练</span>
        </button>
        <button class="mode-card" data-mode="challenge">
          <span class="mode-emoji">⏱️</span>
          <span class="mode-name">挑战模式</span>
          <span class="mode-desc">限时 60 秒，连对加分冲高分</span>
        </button>
      </div>
      <div class="best-score" id="homeBest"></div>
      <a class="kids-switch" href="kids.html">👶 中班小朋友点这里：数数启蒙版</a>
    </section>

    <!-- ========== 关卡地图 ========== -->
    <section id="screen-map" class="screen">
      <div class="map-head">
        <button class="btn ghost small" data-back>← 返回</button>
        <div class="map-crystal" id="mapCrystal">💎 0 / 12</div>
      </div>
      <div id="finaleBanner" class="finale-banner" hidden>👑 水晶集齐！点最终关开启大结局 👑</div>
      <div class="map-worlds" id="mapWorlds"></div>
    </section>

    <!-- ========== 速算秘籍书架 ========== -->
    <section id="screen-scrolls" class="screen">
      <div class="map-head">
        <button class="btn ghost small" data-back>← 返回</button>
        <div class="map-crystal" id="scrollsProgress">🌟 掌握 0 / 8</div>
      </div>
      <div id="scrollsMaster" class="finale-banner" hidden>👑 上卷全部掌握 · 速算大师就是你！👑</div>
      <div class="scroll-shelf" id="scrollShelf"></div>
      <p class="chase-tip" id="scrollTip" aria-live="polite"></p>
    </section>

    <!-- ========== 秘籍学习卡 ========== -->
    <section id="screen-scrollLearn" class="screen">
      <div class="map-head">
        <button class="btn ghost small" id="scrollBackBtn" type="button">← 秘籍</button>
        <div class="map-crystal" id="scrollStars"></div>
      </div>
      <div class="scroll-detail">
        <div class="scroll-title" id="scrollTitle"></div>
        <div class="scroll-mantra" id="scrollMantra"></div>
        <div class="scroll-demo" id="scrollDemo"></div>
        <div class="btn-row">
          <button id="demoNextBtn" class="btn ghost" type="button">下一步 ▸</button>
        </div>
        <div class="btn-row">
          <button id="scrollDrillBtn" class="btn primary" type="button">开始演练 ✏️</button>
          <button id="scrollTestBtn" class="btn ghost" type="button" disabled>考验需先完成演练</button>
        </div>
      </div>
    </section>

    <!-- ========== 练习设置 ========== -->
    <section id="screen-setup" class="screen">
      <h2>选择要练习的题型</h2>
      <div class="type-grid" id="typeGrid">
        <label class="type-chip"><input type="checkbox" value="add" checked>➕ 加法</label>
        <label class="type-chip"><input type="checkbox" value="sub" checked>➖ 减法</label>
        <label class="type-chip"><input type="checkbox" value="mul" checked>✖️ 乘法</label>
        <label class="type-chip"><input type="checkbox" value="div" checked>➗ 除法</label>
      </div>
      <p class="hint" id="setupHint"></p>
      <div class="btn-row">
        <button id="startPracticeBtn" class="btn primary">开始练习</button>
        <button class="btn ghost" data-back>返回</button>
      </div>
    </section>

    <!-- ========== 游戏 ========== -->
    <section id="screen-game" class="screen">
      <div class="game-bar">
        <span id="gameModeLabel"></span>
        <span id="gameStats"></span>
        <button class="icon-btn" id="quitBtn" type="button" title="结束本轮" aria-label="结束本轮">✖</button>
      </div>

      <div class="timer-row" id="timerRow" hidden>
        <span id="timerText"></span>
        <div class="timer-track"><div class="timer-bar" id="timerBar"></div></div>
      </div>

      <!-- 闯关追逐场景：怪兽在追，公主要赶到终点 -->
      <div class="chase-scene" id="chaseScene" hidden>
        <div class="chase-track" id="chaseTrack">
          <div class="chase-goal" id="chaseGoal"></div>
          <div class="chase-runner chase-monster" id="chaseMonster"></div>
          <div class="chase-runner chase-princess" id="chasePrincess"></div>
        </div>
        <div class="chase-tip" id="chaseTip"></div>
      </div>

      <div class="question-card" id="questionCard">
        <div class="question-text" id="questionText"></div>
        <div class="answer-row">
          <span class="eq">=</span>
          <input class="answer-box" id="box1" readonly inputmode="numeric" autocomplete="off" tabindex="0" aria-label="答案">
          <span class="remainder-slot" id="remSlot" hidden>余 <input class="answer-box" id="box2" readonly inputmode="numeric" autocomplete="off" tabindex="0" aria-label="余数"></span>
        </div>
      </div>

      <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

      <button class="key rem-key" id="remKey" hidden>填写余数 →</button>

      <div class="keypad" id="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key fn" data-key="back">⌫</button>
        <button class="key" data-key="0">0</button>
        <button class="key fn ok" data-key="ok">✓</button>
      </div>

      <p class="foot-note">提示：也可以直接用键盘输入，回车确定</p>
    </section>

    <!-- ========== 结果 ========== -->
    <section id="screen-result" class="screen">
      <h2 id="resultTitle"></h2>
      <div class="stars-row" id="starsRow" hidden>
        <span class="big-star" id="star1">★</span>
        <span class="big-star" id="star2">★</span>
        <span class="big-star" id="star3">★</span>
      </div>
      <div class="result-card">
        <div id="resultStats"></div>
      </div>
      <div class="best-box" id="bestBox" hidden></div>
      <div class="btn-row" id="normalBtns">
        <button id="againBtn" class="btn primary">再来一轮</button>
        <button class="btn ghost" data-back>回首页</button>
      </div>
      <div class="btn-row" id="advBtns" hidden>
        <button id="nextLevelBtn" class="btn primary">下一关 →</button>
        <button id="retryBtn" class="btn primary">再试一次</button>
        <button id="mapBtn" class="btn ghost">回地图</button>
      </div>
      <div class="btn-row" id="scrollBtns" hidden>
        <button id="scrollNextBtn" class="btn primary" type="button">下一张秘籍 →</button>
        <button id="scrollGoTestBtn" class="btn primary" type="button">掌握考验 🌟</button>
        <button id="scrollAgainBtn" class="btn ghost" type="button">再演练一次</button>
        <button id="scrollShelfBtn" class="btn ghost" type="button">返回秘籍</button>
      </div>
    </section>

  </main>

  <!-- 全屏特效层（彩带 / 雪花 / 冰晶绽放） -->
  <div class="fx-layer" id="fxLayer"></div>

  <script src="game.js"></script>
</body>
</html>
