name: Apply code review fixes

on:
  push:
    branches:
      - fix/code-review-findings

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        run: python3 .github/scripts/apply-review-fixes.py

      - name: Run regression suite
        run: |
          node tests/review-fixes.test.mjs
          node tests/scrolls.test.mjs
          node tests/kids.test.mjs
          node tests/review-regressions.test.mjs
          git diff --check

      - name: Commit verified fixes and remove one-shot automation
        run: |
          rm -f .github/workflows/apply-review-fixes.yml
          rm -f .github/scripts/apply-review-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            game.js \
            kids.js \
            sw.js \
            README.md \
            tests/review-fixes.test.mjs \
            tests/scrolls.test.mjs \
            tests/kids.test.mjs \
            tests/review-regressions.test.mjs \
            .github/workflows/apply-review-fixes.yml \
            .github/scripts/apply-review-fixes.py
          git commit -m "Fix code review findings"
          git push origin HEAD:fix/code-review-findings
