name: Apply code review fixes

on:
  push:
    branches:
      - agent/fix-code-review-findings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-code-review-findings
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        env:
          PATCH_B64: 
        run: |
          python3 - <<'PYCODE'
          import base64, os, zlib
          exec(compile(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])), 'apply_fixes.py', 'exec'))
          PYCODE

      - name: Validate
        shell: bash
        run: |
          node --check game.js
          node --check sw.js
          node tests/review-fixes.test.mjs
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复代码审查发现的问题"
          git push origin HEAD:agent/fix-code-review-findings
